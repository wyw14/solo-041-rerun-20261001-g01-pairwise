<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BioTreat 异常处置</title><link rel="stylesheet" href="/assets/app.css"></head>
<body><header><div class="brand">BioTreat 工艺联控</div><nav><a href="/process">工艺总控</a><a href="/aeration">曝气调节</a><a href="/sludge">污泥回流</a><a aria-current="page" href="/alarms">异常处置</a></nav></header>
<main><div class="page-head"><div><h1>工艺告警</h1><div class="muted">当前异常、确认状态和处理线隔离信息</div></div><div class="status"><span class="dot"></span><span id="health">checking</span></div></div>
<div class="grid">
  <section class="panel wide"><h2>进水/均衡池溢流保护</h2><table><thead><tr><th>池编号</th><th>处理线</th><th>液位</th><th>保护状态</th><th>允许进水 m³/h</th><th>触发依据</th><th>恢复条件</th><th>批次/告警</th></tr></thead><tbody id="protection"></tbody></table></section>
  <section class="panel"><h2>上报池水位</h2><form id="waterlevel"><label>池编号<select name="basin"><option>EQ-line-1</option><option>EQ-line-2</option><option>EQ-line-3</option></select></label><label>当前水量 m³<input name="volume" type="number" step="1" value="1300"></label><label>样本序号<input name="sequence" type="number" value="1" min="1"></label><button>上报水位</button></form></section>
  <section class="panel wide"><h2>告警队列</h2><table><thead><tr><th>级别</th><th>处理线</th><th>内容</th><th>状态</th><th></th></tr></thead><tbody id="alarms"></tbody></table></section>
  <section class="panel"><h2>污泥界面采样</h2><form id="blanket"><label>处理线<select name="line"><option>line-1</option><option>line-2</option><option>line-3</option></select></label><label>界面高度 m<input name="level" type="number" step="0.1" value="3.1"></label><button>更新沉降状态</button></form></section>
  <section class="panel wide"><h2>处置结果</h2><pre id="output">等待处置</pre></section>
</div></main>
<script src="/assets/common.js"></script><script>
const levelName={normal:'正常',warning:'预警',restricted:'限流',stopped:'停止进水'};
function basisText(p){if(!p.basis)return '-';const b=p.basis;const trig=b.triggered_by==='projection'?'流量预测':'实测液位';return `${b.code} ${trig} ${(b.level_ratio*100).toFixed(1)}% (预测 ${(b.projected_ratio*100).toFixed(1)}%) seq=${b.sequence}`}
async function loadProtection(){const d=await request('/api/intake/protection');document.querySelector('#protection').innerHTML=d.protection.map(p=>`<tr><td>${p.basin_id}</td><td>${p.line_id||'-'}</td><td>${(p.fill_ratio*100).toFixed(1)}%</td><td>${levelName[p.level]||p.level}</td><td>${p.allowed_flow.toFixed(0)}</td><td>${basisText(p)}</td><td>${p.recovery.description||'-'}</td><td>${p.batch_id?'批次 '+p.batch_id.slice(0,8):'-'}${p.alarm_id?'<br>告警 '+p.alarm_id.slice(0,8):''}</td></tr>`).join('')}
async function loadAlarms(){const d=await request('/api/alarms');document.querySelector('#alarms').innerHTML=d.alarms.map(a=>`<tr><td>${a.severity}</td><td>${a.line_id}</td><td>${a.message}</td><td>${a.acknowledged?'已确认':'待确认'}</td><td><button data-id="${a.id}">确认</button></td></tr>`).join('');document.querySelectorAll('[data-id]').forEach(b=>b.onclick=async()=>{try{show(await request(`/api/alarms/${b.dataset.id}/ack`,{method:'POST',body:'{}'}));loadAlarms()}catch(err){showError(err)}})}
document.querySelector('#waterlevel').addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(e.target);const seq=Number(f.get('sequence'));try{show(await request('/api/samples',{method:'POST',body:JSON.stringify({basin_id:f.get('basin'),kind:'water_level',sequence:seq,value:Number(f.get('volume')),unit:'m3'})}));e.target.sequence.value=String(seq+1);loadProtection();loadAlarms()}catch(err){showError(err)}});
document.querySelector('#blanket').addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(e.target);try{show(await request(`/api/settling/${f.get('line')}/blanket`,{method:'POST',body:JSON.stringify({level:Number(f.get('level'))})}));loadAlarms()}catch(err){showError(err)}});
Promise.all([loadProtection(),loadAlarms()]).catch(showError);
</script></body></html>
